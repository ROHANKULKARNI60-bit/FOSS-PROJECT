<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Digital Voting System – Feed</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>

<style>

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root{
--bg:#0d1117;
--surface:#161b27;
--border:rgba(124,111,247,0.15);
--accent:#7c6ff7;
--accent2:#a78bfa;
--text:#e2e8f0;
--muted:#94a3b8;
--dim:#64748b;
--blue:#7dd3fc;
--green:#6ee7b7;
--sw:220px;
--sc:62px;
}

body{
background:var(--bg);
color:var(--text);
font-family:'DM Sans',sans-serif;
min-height:100vh;
display:flex;
overflow-x:hidden;
}

/* SIDEBAR */

aside{
width:var(--sw);
min-width:var(--sw);
background:linear-gradient(180deg,#111827 0%,#0d1117 100%);
border-right:1px solid var(--border);
display:flex;
flex-direction:column;
position:sticky;
top:0;
height:100vh;
transition:width .3s;
overflow:hidden;
}

aside.collapsed{
width:var(--sc);
min-width:var(--sc);
}

.sidebar-top{
display:flex;
align-items:center;
padding:14px;
border-bottom:1px solid rgba(255,255,255,0.06);
}

.toggle-btn{
background:transparent;
border:none;
cursor:pointer;
display:flex;
flex-direction:column;
gap:5px;
}

.toggle-btn span{
height:2px;
background:var(--accent2);
display:block;
}

.toggle-btn span:nth-child(1){width:20px}
.toggle-btn span:nth-child(2){width:14px}
.toggle-btn span:nth-child(3){width:17px}

.sidebar-rail{
display:flex;
flex-direction:column;
padding:10px;
gap:8px;
flex:1;
}

.avatar-row{
display:flex;
align-items:center;
gap:10px;
padding:8px;
border-radius:10px;
}

.avatar{
width:34px;
height:34px;
border-radius:50%;
background:linear-gradient(135deg,var(--accent),var(--accent2));
display:flex;
align-items:center;
justify-content:center;
font-weight:700;
}

.user-info{
white-space:nowrap;
}

aside.collapsed .user-info{
display:none;
}

.settings-btn{
display:flex;
align-items:center;
gap:10px;
padding:8px;
border:none;
background:transparent;
color:var(--muted);
cursor:pointer;
}

.settings-dropdown{
max-height:0;
overflow:hidden;
transition:max-height .3s;
}

.settings-dropdown.open{
max-height:200px;
}

.drop-item{
display:flex;
align-items:center;
gap:10px;
padding:8px;
background:transparent;
border:none;
color:var(--muted);
cursor:pointer;
}

/* MAIN */

main{
flex:1;
padding:24px 30px;
overflow-y:auto;
}

.topbar{
display:flex;
align-items:center;
gap:14px;
margin-bottom:20px;
}

.logo-block{
display:flex;
align-items:center;
gap:8px;
}

.logo-dot{
width:10px;
height:10px;
border-radius:50%;
background:var(--accent);
box-shadow:0 0 10px var(--accent);
}

.logo-title{
font-family:'Syne',sans-serif;
font-weight:800;
font-size:17px;
letter-spacing:2px;
color:var(--accent2);
}

.logo-sub{
font-size:9px;
color:var(--dim);
}

.search-wrap{
flex:1;
display:flex;
align-items:center;
background:var(--surface);
border:1px solid var(--border);
border-radius:14px;
padding:0 16px;
gap:10px;
}

.search-wrap input{
flex:1;
background:transparent;
border:none;
outline:none;
color:var(--text);
padding:12px 0;
}

.create-btn{
background:linear-gradient(135deg,var(--accent),var(--accent2));
border:none;
border-radius:10px;
color:white;
padding:10px 18px;
cursor:pointer;
font-weight:700;
}

.cat-row{
display:flex;
gap:12px;
margin-bottom:22px;
flex-wrap:wrap;
}

.cat-chip{
padding:6px 14px;
border-radius:20px;
border:1px solid rgba(124,111,247,0.25);
background:transparent;
color:var(--muted);
cursor:pointer;
}

.cat-chip.active{
background:rgba(124,111,247,0.2);
color:var(--accent2);
}

.feed-header{
display:flex;
gap:8px;
margin-bottom:18px;
font-weight:700;
}

.feed-count{
background:rgba(124,111,247,0.2);
color:var(--accent2);
border-radius:20px;
padding:2px 10px;
font-size:12px;
}

.poll-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(350px,1fr));
gap:18px;
}

.poll-card{
background:var(--surface);
border:1px solid rgba(124,111,247,0.1);
border-radius:18px;
padding:20px;
cursor:pointer;
transition:.2s;
}

.poll-card:hover{
transform:translateY(-3px);
border-color:rgba(124,111,247,0.3);
box-shadow:0 10px 40px rgba(124,111,247,0.15);
}

.badge{
border-radius:6px;
padding:3px 10px;
font-size:11px;
font-weight:700;
}

.badge-cat{
background:rgba(124,111,247,0.15);
color:var(--accent2);
}

.badge-club{
background:rgba(56,189,248,0.1);
color:var(--blue);
}

.badge-ind{
background:rgba(52,211,153,0.1);
color:var(--green);
}

.card-header{
display:flex;
justify-content:space-between;
margin-bottom:12px;
}

.poll-title{
font-size:15px;
font-weight:700;
margin-bottom:12px;
}

.tap-hint{
font-size:12px;
color:var(--dim);
}

.empty{
text-align:center;
padding:60px 20px;
color:var(--dim);
}

</style>
</head>

<body>

<aside id="sidebar">

<div class="sidebar-top">
<button class="toggle-btn" onclick="toggleSidebar()">
<span></span>
<span></span>
<span></span>
</button>
</div>

<div class="sidebar-rail">

<div class="avatar-row">
<div class="avatar">JD</div>
<div class="user-info">
<div>John Doe</div>
<div style="font-size:11px;color:var(--dim)">Student · CS</div>
</div>
</div>

<button class="settings-btn" onclick="toggleSettings()">⚙️ Settings</button>

<div class="settings-dropdown" id="settingsDd">
<button class="drop-item">👤 Profile</button>
<button class="drop-item">🏛️ My Groups</button>
<button class="drop-item">🎨 Appearance</button>
<button class="drop-item">🚪 Logout</button>
</div>

</div>
</aside>

<main>

<div class="topbar">
<div class="logo-block">
<span class="logo-dot"></span>
<div>
<div class="logo-title">DVS</div>
<div class="logo-sub">Digital Voting</div>
</div>
</div>

<div class="search-wrap">
🔍
<input id="searchInput" placeholder="Search polls..." oninput="filterPolls()">
</div>

<button class="create-btn">+ Create Poll</button>
</div>

<div class="cat-row" id="catList"></div>

<div class="feed-header">
Live Polls
<span class="feed-count" id="pollCount">0</span>
</div>

<div class="poll-grid" id="pollGrid"></div>

</main>

<script>

function toggleSidebar(){
document.getElementById('sidebar').classList.toggle('collapsed')
}

function toggleSettings(){
document.getElementById('settingsDd').classList.toggle('open')
}

const categories=["All","Food","Sports","General","Tech","Culture","Science"]

let activeCategory="All"

const polls=[
{id:1,title:"Best Canteen Option for Next Month",category:"Food",group:"Canteen Club",type:"club",deadline:"Mar 12"},
{id:2,title:"Fest Theme Selection – Annual Cultural Fest",category:"Culture",group:"Cultural Committee",type:"club",deadline:"Mar 15"},
{id:3,title:"Should we shift practice timings to evening?",category:"Sports",group:"Football Club",type:"club",deadline:"Mar 10"},
{id:4,title:"Best Speaker for Tech Talk Series",category:"Tech",group:null,type:"individual",deadline:"Mar 14"},
{id:5,title:"New Library Timings Feedback",category:"General",group:"Student Council",type:"club",deadline:"Mar 18"},
{id:6,title:"Science Club Annual Project Theme",category:"Science",group:"Science Society",type:"club",deadline:"Mar 20"}
]

const catList=document.getElementById("catList")

categories.forEach(cat=>{
const btn=document.createElement("button")
btn.className="cat-chip"+(cat==="All"?" active":"")
btn.textContent=cat

btn.onclick=()=>{
document.querySelectorAll(".cat-chip").forEach(b=>b.classList.remove("active"))
btn.classList.add("active")
activeCategory=cat
filterPolls()
}

catList.appendChild(btn)
})

function filterPolls(){

const search=document.getElementById("searchInput").value.toLowerCase()

const filtered=polls.filter(p=>
(activeCategory==="All"||p.category===activeCategory)&&
p.title.toLowerCase().includes(search)
)

renderPolls(filtered)

}

function renderPolls(list){

const grid=document.getElementById("pollGrid")
grid.innerHTML=""

document.getElementById("pollCount").textContent=list.length

if(!list.length){
grid.innerHTML=`<div class="empty">No polls found</div>`
return
}

list.forEach(poll=>{

const card=document.createElement("div")
card.className="poll-card"

card.onclick=()=>{
window.location.href=`poll.html?id=${poll.id}`
}

const groupBadge=poll.type==="club"
?`<span class="badge badge-club">🏛 ${poll.group}</span>`
:`<span class="badge badge-ind">👤 Individual</span>`

card.innerHTML=`

<div class="card-header">
<div>
<span class="badge badge-cat">${poll.category}</span>
${groupBadge}
</div>
<span style="font-size:11px;color:var(--dim)">⏰ ${poll.deadline}</span>
</div>

<div class="poll-title">${poll.title}</div>

<div class="tap-hint">Click to open poll</div>

`

grid.appendChild(card)

})

}

filterPolls()

</script>

</body>
</html>
